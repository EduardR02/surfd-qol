# Signalling for Surfd QoL private rooms. Deploy with `npx wrangler deploy`
# from this folder (see README.md); it is not part of the extension build.
name = "surfd-signal"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# Every room connects through Cloudflare's TURN relay, with credentials from
# the TURN key in the secrets TURN_KEY_ID and TURN_KEY_API_TOKEN. Anything but
# "on" stops issuing them, which stops new rooms and joins.
[vars]
RELAY = "on"

# One Durable Object per room.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# The directory of public rooms.
[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

# SQLite-backed Durable Objects are the kind the free plan includes.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Lobby"]

[[migrations]]
tag = "v3"
deleted_classes = ["Lobby"]

# Public rooms are back, so the directory is too.
[[migrations]]
tag = "v4"
new_sqlite_classes = ["Lobby"]
