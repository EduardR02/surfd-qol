# Signalling for Surfd QoL private rooms. Deploy with `npx wrangler deploy`
# from this folder (see README.md); it is not part of the extension build.
name = "surfd-signal"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# Every room connects through Cloudflare's TURN relay, with credentials from
# the TURN key in the secrets TURN_KEY_ID and TURN_KEY_API_TOKEN. Anything but
# "on" stops issuing them, which stops new rooms and joins. Opt in deliberately:
# room ownership is NOT surfd account authentication.
[vars]
RELAY = "off"
# Explicit example grant budgets; choose limits before enabling paid relay.
# All three MUST be positive safe integers. Counts are global rolling windows,
# persisted in the singleton Lobby, and failed requests burn reservations.
# Unexpired includes the one-hour TTL and five-second issuance window.
# Count holders as one host plus one per guest. With 1h credentials renewed at
# 45m, each continuous holder uses about 32 grants/day and overlaps two grants
# in the hourly and unexpired windows: daily allows at most 32 continuous
# holders, while the hourly/unexpired examples theoretically allow 128.
# Leave margin for joins, reconnects and failures. A 256-holder initial cohort
# exhausts the hourly and unexpired quotas and cannot renew at 45m. Credential
# limits are not room-capacity, byte, or spending guarantees.
RELAY_GRANTS_PER_HOUR = "256"
RELAY_GRANTS_PER_DAY = "1024"
RELAY_MAX_UNEXPIRED = "256"

# One Durable Object per room.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# The directory of public rooms.
[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

# SQLite-backed Durable Objects are the kind the free plan includes.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Lobby"]

[[migrations]]
tag = "v3"
deleted_classes = ["Lobby"]

# Public rooms are back, so the directory is too.
[[migrations]]
tag = "v4"
new_sqlite_classes = ["Lobby"]
